<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gold &amp; Macro Intelligence</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      overflow: hidden; background: #f2f2f2;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .wrap { position: relative; width: 100%; height: 100vh; overflow: hidden; }
    .wrap iframe {
      position: absolute; top: -52px; left: 0;
      width: 100%; height: calc(100vh + 52px);
      border: 0; background: #ffffff;
    }
    /* Sign-in landing panel */
    #signin-panel {
      display: none; position: fixed; inset: 0;
      background: #f2f2f2; z-index: 100;
      align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    #signin-panel.visible { display: flex; }
    .card {
      background: #fff; border: 1px solid #e3e8ee;
      border-radius: 12px; padding: 32px 28px;
      max-width: 380px; width: 100%;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    }
    .card h1 { font-size: 20px; margin: 0 0 10px 0; color: #16213e; }
    .card p { font-size: 14px; color: #667; line-height: 1.6; margin: 0 0 20px 0; }
    .card a {
      display: inline-block; padding: 11px 24px;
      border-radius: 8px; background: #1a1a2e; color: #fff;
      font-size: 14px; font-weight: 600; text-decoration: none;
    }
  </style>
</head>
<body>

  <div id="signin-panel">
    <div class="card">
      <h1>Sign in to view the dashboard</h1>
      <p>This dashboard is private. Click below to sign in with the authorised Google account.</p>
      <a id="signin-link" href="#" target="_blank" rel="noopener">Open in a new tab to sign in →</a>
    </div>
  </div>

  <div class="wrap">
    <iframe id="app-frame"
            src="https://script.google.com/macros/s/AKfycbw5y62hhKJi93whytk8xNV9tj_ZJGEh1BBiRz5Wm4sklDqa0fE0lYYZP1mDhJjJtOPvGw/exec"
            allow="clipboard-read; clipboard-write"
            referrerpolicy="no-referrer"></iframe>
  </div>

  <script>
    var APP_URL = 'https://script.google.com/macros/s/AKfycbw5y62hhKJi93whytk8xNV9tj_ZJGEh1BBiRz5Wm4sklDqa0fE0lYYZP1mDhJjJtOPvGw/exec';

    // If the page was opened from a fresh browser with no Google session,
    // the iframe will fail silently with a 401. There's no clean way to
    // detect this from the parent page, so we always show a one-time
    // sign-in hint on first visit and let the user dismiss it.
    //
    // On subsequent visits (session cookie present) the iframe just loads.
    var hasVisited = false;
    try { hasVisited = sessionStorage.getItem('dashboard-visit') === '1'; } catch (e) {}

    if (!hasVisited) {
      document.getElementById('signin-panel').classList.add('visible');
      document.getElementById('signin-link').href = APP_URL;
      try { sessionStorage.setItem('dashboard-visit', '1'); } catch (e) {}
    }
  </script>

</body>
</html>
