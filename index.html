<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#10141a">
<title>Volume Profile · Pin Zones</title>
<style>
/* ... (Keep all your existing CSS exactly as it is in your file) ... */
:root{
  color-scheme:dark;
  --bg:#10141a; --panel:#1a2029; --field:#0d1117; --text:#d8dee9; --muted:#8a95a5; --grid:#202733; --border:#333c4a;
  --up:#4ade80; --down:#f87171; --accent:#2563eb; --band:rgba(37,99,235,.10);
  --boundary:#6b7686; --cross:#8a95a5; --poc:#ef4444; --valine:#fb923c; --warn:#facc15;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  height:100vh;height:100dvh;
  background:var(--bg);color:var(--text);
  font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button{font:inherit;font-size:13px;color:#fff;background:var(--accent);border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
button.ghost{color:var(--text);background:var(--field);border:1px solid var(--border);padding:5px 10px}

/* ---- slim top bar ---- */
.top{display:flex;align-items:center;gap:8px;padding:3px 8px;min-height:34px;background:var(--panel);border-bottom:1px solid var(--border)}
.gear{padding:4px 10px;font-size:13px;white-space:nowrap}
.menu{width:34px;height:28px;padding:0;flex:none;display:grid;place-items:center}
.menu svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;fill:none;pointer-events:none}
.drawer{position:absolute;left:0;top:0;bottom:0;width:min(350px,90vw);z-index:6;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--border);
  box-shadow:8px 0 28px rgba(0,0,0,.5);transform:translateX(-104%);visibility:hidden;transition:transform .18s ease,visibility 0s .18s}
.drawer.open{transform:none;visibility:visible;transition:transform .18s ease}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--border);font-weight:700}
.dbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 12px 18px}
.dsec{font-size:11px;letter-spacing:.09em;color:var(--muted);text-transform:uppercase;margin:14px 0 6px}
.irow{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--field)}
.irow.off .iname{opacity:.45}
.isw{width:12px;height:12px;border-radius:50%;flex:none;border:0;padding:0;cursor:pointer}
.iname{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iname small{display:block;color:var(--muted);font-size:11px}
button.ib{width:30px;height:30px;padding:0;flex:none;display:grid;place-items:center;color:var(--text);background:transparent;border:1px solid transparent;border-radius:6px}
button.ib:hover{background:var(--panel)}
.ib svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;fill:none;pointer-events:none}
.iparams{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:2px 2px 10px;margin:-2px 0 8px}
.iparams label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.iparams input{width:100%;font:inherit;font-size:14px;color:var(--text);background:var(--field);border:1px solid var(--border);border-radius:6px;padding:6px 8px}
.arow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 10px;margin-bottom:6px;color:var(--text);background:var(--field);border:1px solid var(--border);border-radius:8px}
.arow:hover{border-color:var(--accent)}
.arow:disabled{opacity:.5;cursor:default}
.arow .nm{flex:1;font-size:14px}
.arow .pl{font-size:11px;color:var(--muted)}
.arow .pl2{font-weight:700;color:var(--accent)}
.sblock{padding:2px 2px 12px;margin:-2px 0 8px}
.dsub{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px;font-weight:600}
.cfm{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.55)}
.cfm .box{width:min(340px,100%);background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.cfm p{margin:0 0 16px;font-size:14px;line-height:1.45;word-break:break-word}
.cfm .row{display:flex;gap:8px;justify-content:flex-end}
.cfm button.cancel{background:var(--field);color:var(--text);border:1px solid var(--border)}
.cfm button.ok{background:#dc2626}
.dtog{display:flex;align-items:center;justify-content:space-between;width:100%;margin:14px 0 6px;padding:8px 0;background:none;border:0;border-top:1px solid var(--border);border-radius:0;color:#f5b301;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;text-align:left}
.dtog:hover{color:#ffd24a}
.dtog em{font-style:normal;letter-spacing:0;margin-left:4px;padding:1px 6px;border-radius:9px;background:var(--field);color:var(--text)}
.dtog .chev{width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin:-3px 4px 0 0;transition:transform .15s}
.dtog[aria-expanded="true"] .chev{transform:rotate(-135deg);margin-top:3px}
.dcol[hidden]{display:none}
.tplsave{display:flex;gap:6px;margin-bottom:8px}
.tplsave input{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--text);background:var(--field);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.tplrow{display:flex;align-items:center;gap:6px;margin-bottom:6px;padding:6px 6px 6px 10px;background:var(--field);border:1px solid var(--border);border-radius:8px}
.tplrow .nm{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tplrow small{display:block;font-size:11px;color:var(--muted)}
.tplrow button{padding:6px 10px;font-size:12px}
.tplrow button.ghost{background:transparent;color:var(--muted)}
.dnote{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5}
.tfsel{width:auto;flex:none;height:28px;padding:2px 6px;font-size:13px;font-weight:600;color:var(--text);background:var(--field);border:1px solid var(--border);border-radius:6px}
.tfsel:disabled{opacity:.45}
.live{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--boundary);flex:none}
.dot.live{background:var(--up);box-shadow:0 0 6px var(--up)}
.dot.poll{background:var(--warn)}
.dot.offline{background:var(--down)}
.px{font-size:15px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.px.up,.chg.up{color:var(--up)}.px.down,.chg.down{color:var(--down)}

.alert{display:flex;align-items:center;gap:8px;padding:3px 8px;background:#2b2308;color:var(--warn);border-bottom:1px solid #4a3a0c;font-size:12px}
.alert span{flex:1;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.alert button{padding:0 8px;font-size:16px;line-height:24px}
main{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;touch-action:none;cursor:crosshair;display:block}
.zoom{position:absolute;right:76px;bottom:28px;display:flex;gap:4px}
.tb{display:flex;align-items:center;gap:2px;margin-left:auto;min-width:0;overflow-x:auto;scrollbar-width:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tb::-webkit-scrollbar{display:none}
.top .live{margin-left:12px}
button.tbtn{width:30px;height:28px;padding:0;flex:none;display:grid;place-items:center;color:var(--text);background:transparent;border:1px solid transparent;border-radius:6px}
button.tbtn:hover{background:var(--field)}
button.tbtn.on{background:var(--accent);color:#fff}
.tbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.tbtn .cdot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;pointer-events:none}
.tsep{width:1px;height:18px;background:var(--border);margin:0 3px;flex:none}
@media (max-width:720px){
  .top{flex-wrap:wrap}
  .tb{order:3;flex:0 0 100%;margin-left:0;padding-bottom:2px}
  button.tbtn{width:27px}
  .top .live{margin-left:auto;gap:5px}
  .top #state{display:none}
}
.zoom button{width:30px;height:30px;padding:0;font-size:16px;line-height:1;opacity:.85}
.panel{position:absolute;left:0;right:0;top:0;z-index:5;max-height:82%;overflow:auto;-webkit-overflow-scrolling:touch;
  background:var(--panel);border-bottom:2px solid var(--accent);box-shadow:0 10px 28px rgba(0,0,0,.55);padding:0 12px 14px}
.phead{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:10px 0 8px;background:var(--panel)}
:is(.panel,.drawer) h3{margin:14px 0 8px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fields .wide{grid-column:1/-1}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px}
:is(.panel,.drawer) label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);min-width:0}
:is(.panel,.drawer) label.chk{flex-direction:row;align-items:center;gap:9px;font-size:13px;color:var(--text)}
:is(.panel,.drawer) label.chk input{width:18px;height:18px;margin:0}
:is(.panel,.drawer) label.btnwrap{justify-content:flex-end}
:is(.panel,.drawer) select,:is(.panel,.drawer) input[type=text],:is(.panel,.drawer) input[type=search],:is(.panel,.drawer) input[type=password],:is(.panel,.drawer) input[type=number],:is(.panel,.drawer) input[type=file]{
  width:100%;font:inherit;font-size:14px;color:var(--text);background:var(--field);border:1px solid var(--border);border-radius:6px;padding:8px}
:is(.panel,.drawer) .row{display:flex;gap:6px}
:is(.panel,.drawer) .row select{width:auto;flex:none}
.info{display:flex;flex-direction:column;gap:3px;font-size:12px;min-height:30px}
.info .k{font-weight:600}.info .up{color:var(--up);font-weight:600}.info .down{color:var(--down);font-weight:600}
.info .m{color:var(--muted)}.info .warn{color:var(--warn)}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:baseline}
#status{color:var(--muted)}
.note{margin:14px 0 0;font-size:11px;color:var(--muted)}
@media (max-width:600px){
  :is(.panel,.drawer) select,:is(.panel,.drawer) input[type=text],:is(.panel,.drawer) input[type=search],:is(.panel,.drawer) input[type=password],:is(.panel,.drawer) input[type=number]{font-size:16px}
  .zoom{right:64px;bottom:26px}
  .gear{padding:4px 8px}
}
</style>
</head>
<body>

<header class="top">
  <button id="menuBtn" class="gear menu" type="button" aria-label="Indicators" title="Indicators" aria-expanded="false" aria-controls="drawer"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <button id="gear" class="gear" type="button" aria-expanded="false" aria-controls="panel">⚙ Settings</button>
  <select id="tf" class="tfsel" title="Chart timeframe" aria-label="Chart timeframe">
    <option value="1m">1m</option><option value="5m">5m</option>
    <option value="15m" selected>15m</option><option value="30m">30m</option>
    <option value="1h">1h</option><option value="4h">4h</option>
  </select>
  <div class="tb" id="tb" role="toolbar" aria-label="Drawing tools">
    <button class="tbtn on" data-tool="cursor" type="button" title="Cursor"><svg viewBox="0 0 24 24"><path d="M12 3v6M12 15v6M3 12h6M15 12h6"/></svg></button>
    <button class="tbtn" data-tool="measure" type="button" title="Measure"><svg viewBox="0 0 24 24"><path d="M12 3v18M8 7l4-4 4 4M8 17l4 4 4-4M5 12h3M16 12h3"/></svg></button>
    <div class="tsep"></div>
    <button class="tbtn" data-tool="trend" type="button" title="Trend line"><svg viewBox="0 0 24 24"><path d="M4 19L20 5"/><circle cx="4" cy="19" r="1.6"/><circle cx="20" cy="5" r="1.6"/></svg></button>
    <button class="tbtn" data-tool="hline" type="button" title="Horizontal line"><svg viewBox="0 0 24 24"><path d="M3 12h18"/><circle cx="12" cy="12" r="1.6"/></svg></button>
    <button class="tbtn" data-tool="vline" type="button" title="Vertical line"><svg viewBox="0 0 24 24"><path d="M12 3v18"/><circle cx="12" cy="12" r="1.6"/></svg></button>
    <button class="tbtn" data-tool="rect" type="button" title="Rectangle"><svg viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="10" rx="1"/></svg></button>
    <button class="tbtn" data-tool="fib" type="button" title="Fib retracement"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 10h16M4 15h16M4 20h16" opacity=".7"/><path d="M6 20L18 5"/></svg></button>
    <button class="tbtn" data-tool="pen" type="button" title="Pen"><svg viewBox="0 0 24 24"><path d="M15 4l5 5L9 20H4v-5z"/><path d="M13 6l5 5"/></svg></button>
    <div class="tsep"></div>
    <button class="tbtn" data-act="magnet" type="button" title="Magnet"><svg viewBox="0 0 24 24"><path d="M6 3v8a6 6 0 0012 0V3M6 7h4M14 7h4"/></svg></button>
    <button class="tbtn" data-act="color" type="button" title="Colour"><span class="cdot" id="tbDot"></span></button>
    <button class="tbtn" data-act="undo" type="button" title="Undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
    <button class="tbtn" data-act="del" type="button" title="Delete"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/></svg></button>
  </div>
  <div class="live" id="live" title="Live connection status">
    <span class="dot" id="dot"></span><span id="state">–</span><span class="px" id="px"></span><span class="chg" id="chg"></span>
  </div>
</header>

<div class="alert" id="alert" hidden>
  <span id="alertTxt"></span><button id="alertX" class="ghost" type="button" aria-label="Dismiss">×</button>
</div>

<main id="wrap">
  <canvas id="cv"></canvas>
  <div class="zoom">
    <button class="ghost" id="zin" type="button" title="Zoom in">+</button>
    <button class="ghost" id="zout" type="button" title="Zoom out">−</button>
    <button class="ghost" id="zreset" type="button" title="Reset view">⟲</button>
  </div>

  <div id="settingsHold" hidden>
    <div id="vpSettings" class="sblock">
      <div class="dsub">Profile</div>
    <div class="fields">
      <label>Anchor candle
        <select id="anchor">
          <option value="1h">Previous hour</option><option value="4h">Previous 4H</option>
          <option value="1d" selected>Previous day</option><option value="1w">Previous week</option>
          <option value="1M">Previous month</option>
        </select>
      </label>
      <label>Mode
        <select id="mode">
          <option value="pin">Pin zones (2 profiles)</option>
          <option value="whole">Whole candle (1 profile)</option>
        </select>
      </label>
      <label>Periods to show (1–20)<input id="count" type="number" value="1" min="1" max="20" step="1" inputmode="numeric"></label>
      <label>Day boundary offset (hours vs UTC)<input id="offset" type="number" value="0" step="1" min="-12" max="14" inputmode="numeric"></label>
      <label>Rows per profile<input id="rows" type="number" value="30" min="5" max="200" inputmode="numeric"></label>
      <label>Value area %<input id="va" type="number" value="70" min="10" max="100" inputmode="numeric"></label>
      <label>Profile width (bars)<input id="width" type="number" value="25" min="5" max="200" inputmode="numeric"></label>
      <label>Pin wick/body ratio<input id="pinRatio" type="number" value="2" step="0.1" min="0.5" inputmode="decimal"></label>
      <label>Pin max body %<input id="pinBody" type="number" value="35" min="5" max="100" inputmode="numeric"></label>
    </div>
      <div class="dsub">Show on chart</div>
      <div class="checks">
      <label class="chk"><input id="showPOC" type="checkbox" checked>POC</label>
      <label class="chk"><input id="showVA" type="checkbox" checked>VAH / VAL</label>
      <label class="chk"><input id="showBounds" type="checkbox" checked>Candle High/Open/Close/Low</label>
      <label class="chk"><input id="extend" type="checkbox" checked>Extend lines across chart</label>
      <label class="chk"><input id="hiSrc" type="checkbox" checked>Shade anchor candle period</label>
      <label class="chk"><input id="pins" type="checkbox" checked>Mark pin bars</label>
      </div>
      <div class="dsub">Current levels</div>
      <section class="info" id="info" aria-live="polite"></section>
    </div>
    <div id="ratioSettings" class="sblock">
      <div class="dsub">Pair</div>
    <div class="fields">
      <label>Upper symbol (numerator)<input id="rNum" type="text" list="bqSyms" value="XAUUSD" autocomplete="off" autocapitalize="characters" spellcheck="false" onfocus="this.select()"></label>
      <label>Lower symbol (denominator)<input id="rDen" type="text" list="bqSyms" value="XAGUSD" autocomplete="off" autocapitalize="characters" spellcheck="false" onfocus="this.select()"></label>
      <label class="btnwrap"><button id="rSwap" type="button" class="ghost">⇄ Swap</button></label>
      <label class="btnwrap"><button id="rDefault" type="button" class="ghost">Gold / Silver</button></label>
    </div>
    <datalist id="bqSyms"></datalist>
    <p class="note" id="rPairNote" style="margin:6px 0"></p>
    <p class="note" style="margin:0 0 8px">Type any Biquote symbol.</p>
    <div class="fields">
      <label>Line colouring
        <select id="rMode">
          <option value="levels">Fixed tiers (Level 1–4)</option>
          <option value="pct">Adaptive percentiles</option>
        </select>
      </label>
      <label>Tier level 1 (below = lime)<input id="rL1" type="number" value="68" step="any" inputmode="decimal"></label>
      <label>Tier level 2<input id="rL2" type="number" value="70" step="any" inputmode="decimal"></label>
      <label>Tier level 3 (above = orange)<input id="rL3" type="number" value="80" step="any" inputmode="decimal"></label>
      <label>Tier level 4 (above = red)<input id="rL4" type="number" value="90" step="any" inputmode="decimal"></label>
      <label>Low percentile<input id="rLowPct" type="number" value="10" step="1" min="0" max="100" inputmode="decimal"></label>
      <label>High percentile<input id="rHighPct" type="number" value="90" step="1" min="0" max="100" inputmode="decimal"></label>
      <label>Draw percentile lines this many bars back (0 = all)<input id="rDrawBars" type="number" value="50" step="1" min="0" inputmode="numeric"></label>
      <label>MA period (bars)<input id="rMAPeriod" type="number" value="100" step="1" min="2" inputmode="numeric"></label>
      <label class="chk wide"><input id="rAutoLb" type="checkbox">Auto percentile history window</label>
      <label class="wide">Percentile history window in days<input id="rLbDays" type="number" value="365" step="1" min="1" inputmode="numeric"></label>
    </div>
    <div class="checks" style="margin-top:10px">
      <label class="chk"><input id="rShowPct" type="checkbox">Show adaptive percentile lines</label>
      <label class="chk"><input id="rShowMA" type="checkbox" checked>Show moving average</label>
      <label class="chk"><input id="rAlerts" type="checkbox">Alert when a closed bar changes colour zone</label>
    </div>
    </div>
    <input id="showRatio" type="checkbox" checked>
  </div>

  <aside class="drawer" id="drawer" aria-label="Indicators">
    <div class="dhead"><span>Indicators</span><button id="dclose" class="ghost" type="button">Close ×</button></div>
    <div class="dbody" id="dbody"></div>
  </aside>

  <section class="panel" id="panel" hidden aria-label="Settings">
    <div class="phead"><b>Settings</b><button id="pclose" class="ghost" type="button">Close ✕</button></div>
    <h3>Market</h3>
    <div class="fields">
      <label class="wide">Search instrument<input id="instSearch" type="search" placeholder="Search: gold, nasdaq, EURJPY, bitcoin…" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
      <label class="wide">Instrument<select id="inst"></select></label>
      <p class="note wide" id="instCount" style="margin:-2px 0 4px"></p>
    </div>
    <h3>Display</h3>
    <div class="checks">
      <label class="chk"><input id="auto" type="checkbox" checked>Auto-update (live)</label>
    </div>
    <div class="fields" style="margin-top:10px">
      <label class="wide">Bars on screen at start (0 = all loaded bars)<input id="viewBars" type="number" value="0" step="50" min="0" inputmode="numeric"></label>
    </div>
  </section>
</main>

<script>
// ---------------------------------------------------------------------------
// UI: controls, data loading, live feed, interaction
// Math is handled by the backend (Apps Script)
// ---------------------------------------------------------------------------
if(typeof document!=='undefined'){
(function(){
const $=id=>document.getElementById(id);
const cv=$('cv'),wrap=$('wrap'),ctx=cv.getContext('2d');
const S={bars:[],tfMs:15*MIN,title:'',name:'',view:{start:0,barW:8},anchor:null,prof:null,pins:null,hover:null,
  layout:null,dec:5,opts:null,anchorLabel:'',loadId:0,status:'',err:'',anchorWarn:'',dismissed:'',lastPx:null,ratio:null,ratioAlert:'',periods:[],noVolume:false,inds:[{id:'vp',type:'vp',vis:true,color:'#38bdf8',p:{}},{id:'ratio',type:'ratio',vis:true,color:'#38bdf8',p:{}}],
  tool:'cursor',magnet:false,color:'#38bdf8',dw:[],selected:null,pending:null,measure:null,dwKey:null,lastDw:0,mv:null};
let W=800,H=500,raf=0,drag=null,theme=null;

const MIN=60e3, HOUR=3600e3, DAY=86400e3, WEEK=7*DAY, MONDAY0=4*DAY;
const TF_MS={'1m':MIN,'5m':5*MIN,'15m':15*MIN,'30m':30*MIN,'1h':HOUR,'4h':4*HOUR};
const ANCHOR_LABEL={'1h':'Prev Hour','4h':'Prev 4H','1d':'Prev Day','1w':'Prev Week','1M':'Prev Month'};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const INSTRUMENTS=[
  {id:'xau',fav:1,name:'Gold',label:'Gold · XAUUSD (Biquote)',venue:'biquote',sym:'XAUUSD'},
  {id:'xag',fav:1,name:'Silver',label:'Silver · XAGUSD (Biquote)',venue:'biquote',sym:'XAGUSD'},
  {id:'eur',fav:1,name:'EUR/USD',label:'EUR/USD (Biquote)',venue:'biquote',sym:'EURUSD'},
  {id:'jpy',fav:1,name:'USD/JPY',label:'USD/JPY (Biquote)',venue:'biquote',sym:'USDJPY'}
];
const sel=$('inst');
function buildInstMenu(){
  sel.innerHTML='';
  const g=document.createElement('optgroup'); g.label='Instruments';
  for(const it of INSTRUMENTS){const o=document.createElement('option');o.value=it.id;o.textContent=it.label;g.appendChild(o);}
  sel.appendChild(g);
}
buildInstMenu();

function currentInstrument(){
  const id=sel.value;
  return INSTRUMENTS.find(i=>i.id===id);
}

function readTheme(){
  const cs=getComputedStyle(document.documentElement),g=n=>cs.getPropertyValue(n).trim();
  theme={bg:g('--bg'),grid:g('--grid'),text:g('--text'),muted:g('--muted'),up:g('--up'),down:g('--down'),
    band:g('--band'),boundary:g('--boundary'),cross:g('--cross'),poc:g('--poc'),valine:g('--valine'),tagText:'#0b0f14',border:g('--border'),warn:g('--warn'),
    upperBase:'#3b82f6',upperVA:'#38bdf8',lowerBase:'#DAA520',lowerVA:'#F0E68C',pinUp:'#d946ef',pinDown:'#4ade80'};
}

function opts(){
  return{anchor:$('anchor').value,offH:+$('offset').value||0,mode:$('mode').value,
    rows:clamp(Math.round(+$('rows').value)||30,5,200),vaPct:clamp(+$('va').value||70,10,100),
    widthBars:clamp(Math.round(+$('width').value)||25,5,200),
    count:1,
    viewBars:Math.max(0,Math.round(+$('viewBars').value)||0),
    pinRatio:2, pinBody:35,
    showPOC:$('showPOC').checked,showVA:$('showVA').checked,showBounds:$('showBounds').checked,
    extend:$('extend').checked,hiSrc:$('hiSrc').checked,pins:$('pins').checked,auto:$('auto').checked};
}

function resetView(){
  const PW=W-axisW(W),o=S.opts||opts();
  const profPx=Math.min(110,PW*0.22),N=o.viewBars>0?o.viewBars:Math.max(1,S.bars.length);
  let bw=clamp((PW-profPx)/(N+6),0.15,14),extra=profPx/bw+6;
  S.view.barW=bw;
  S.view.start=S.bars.length-PW/bw+extra;
  schedule();
}
function clampStart(s){const pwBars=(W-axisW(W))/S.view.barW;return clamp(s,-pwBars*0.5,S.bars.length+20);}
function zoomAt(f,cx){const bw=S.view.barW,nb=clamp(bw*f,0.15,60),idx=S.view.start+cx/bw;S.view.barW=nb;S.view.start=clampStart(idx-cx/nb);schedule();}
function lastBarVisible(){const n=S.bars.length-1,pw=(W-axisW(W))/S.view.barW;return n>=S.view.start-1&&n<=S.view.start+pw+1;}

function rebuild(){
  const o=S.opts=opts();
  S.anchor=null;S.prof=null;S.pins=null;S.periods=[];S.anchorLabel=ANCHOR_LABEL[o.anchor];
  if(S.bars.length){
    S.dec=decimalsFor(S.bars[S.bars.length-1].c);
  }
  updateInfo();updateTicker();refreshAlert();schedule();
}

function updateInfo(){
  const el=$('info');el.textContent='';
  const row=html=>{const d=document.createElement('div');d.innerHTML=html;el.appendChild(d);return d;};
  const st=document.createElement('div');st.id='status';st.textContent=S.status||'';
  if(!S.bars.length){el.appendChild(st);return;}
  const A=S.anchor,P=S.prof,d=S.dec,f=v=>fmtP(v,d),o=S.opts;
  if(!A){row('<span class="warn">No completed candle found.</span>');el.appendChild(st);return;}
  row('<span class="k">'+S.anchorLabel+'</span> <span class="'+(A.bull?'up':'down')+'">'+(A.bull?'Bull':'Bear')+'</span> '
    +'O '+f(A.o)+' &nbsp;H '+f(A.h)+' &nbsp;L '+f(A.l)+' &nbsp;C '+f(A.c));
  if(P) {
    const names=P.mode==='whole'?['Profile']:['Upper zone','Lower zone'];
    const cols=P.mode==='whole'?['#3b82f6']:['#3b82f6','#DAA520'];
    P.zones.forEach((Z,i)=>{
      row(Z.poc<0?'<span class="sw" style="background:'+cols[i]+'"></span><span class="k">'+names[i]+'</span> <span class="m">no volume</span>'
        :'<span class="sw" style="background:'+cols[i]+'"></span><span class="k">'+names[i]+'</span> '+f(Z.zoneLow)+' – '+f(Z.zoneHigh)
          +' &nbsp;·&nbsp; POC <b>'+f(Z.pocPrice)+'</b> &nbsp;·&nbsp; VAH '+f(Z.vah)+' &nbsp;·&nbsp; VAL '+f(Z.val));
    });
  }
  el.appendChild(st);
}
function showStatus(msg){const s=$('status');if(s)s.textContent=msg;else updateInfo();}
function setStatus(msg){S.status=msg;S.err='';showStatus(msg);refreshAlert();}
function setErr(msg){S.status=msg;S.err=msg;showStatus(msg);refreshAlert();}
function refreshAlert(){
  const msg=S.err||S.anchorWarn||S.ratioAlert||'',show=!!msg&&msg!==S.dismissed;
  $('alert').hidden=!show;$('alertTxt').textContent=show?msg:'';
}

function setLive(state){
  const map={live:['live','Live'],poll:['poll','Polling'],offline:['offline','Offline'],paused:['','Paused'],off:['','–']};
  const m=map[state]||map.off;
  $('dot').className='dot '+m[0];$('state').textContent=m[1];
}
function updateTicker(){
  const n=S.bars.length,pxEl=$('px'),chEl=$('chg');
  if(!n){pxEl.textContent='';chEl.textContent='';return;}
  const last=S.bars[n-1];
  pxEl.textContent=fmtP(last.c,S.dec);
  if(S.lastPx!=null&&last.c!==S.lastPx)pxEl.className='px '+(last.c>S.lastPx?'up':'down');
  S.lastPx=last.c;
  document.title=(S.sym||S.name||'Chart')+' '+fmtP(last.c,S.dec);
}

function decimalsFor(p){p=Math.abs(p);return p<0.1?6:p<10?5:p<1000?3:2;}
function fmtP(p,d){return Number.isFinite(p)?p.toFixed(d):'–';}

// ----- API Call to Backend -----
async function load(keepView){
  const id=++S.loadId,inst=currentInstrument(),o=opts();
  if(!inst) return;
  const tfKey=$('tf').value,tfMs=TF_MS[tfKey];
  setStatus('Loading…');
  try{
    const url = `/chart-api?symbol=${encodeURIComponent(inst.sym)}&tf=${tfKey}&anchor=${o.anchor}&mode=${o.mode}&rows=${o.rows}&vaPct=${o.vaPct}&limit=2000`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    
    if(id!==S.loadId)return;
    
    S.bars = data.bars;
    S.tfMs = tfMs;
    S.title = inst.name+' · '+inst.sym+' · '+tfKey;
    S.name = inst.name;
    S.sym = inst.sym;
    S.lastPx = null;
    S.anchor = data.anchor;
    S.prof = data.profile;
    S.pins = data.pins;
    
    setStatus(S.bars.length ? 'Loaded ' + S.bars.length + ' bars.' : 'No data.');
    rebuild();
    if(!keepView)resetView();
  }catch(e){
    if(id!==S.loadId)return;
    setErr('Could not load data: '+e.message);
  }
}

// ----- Placeholder for rendering (kept from your original file) -----
function axisW(W){return W<520?56:68;}
function schedule(){if(!raf)raf=requestAnimationFrame(draw);}
function draw(){}

// Setup UI
sel.addEventListener('change',()=>load());
$('load').addEventListener('click',()=>load());
$('tf').addEventListener('change',()=>load());

readTheme();
load();

})();
}
</script>
</body>
</html>
