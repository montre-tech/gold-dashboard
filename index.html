<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gold &amp; Macro Intelligence</title>
  <meta name="theme-color" content="#1a1a2e">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #f2f2f2;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }
    /* The negative top offset clips the Apps Script banner off the top of
       the iframe. Adjust -52px if you see a sliver of the banner or the top
       of your hero is cut. */
    .wrap iframe {
      position: absolute;
      top: -52px;
      left: 0;
      width: 100%;
      height: calc(100vh + 52px);
      border: 0;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <iframe
      src="https://script.google.com/macros/s/AKfycbw5y62hhKJi93whytk8xNV9tj_ZJGEh1BBiRz5Wm4sklDqa0fE0lYYZP1mDhJjJtOPvGw/exec"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="no-referrer"></iframe>
  </div>
</body>
</html>
